{% set version = "2026.9.1" %}
package:
  name: rpds-py
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/r/rpds-py/rpds_py-{{ version }}.tar.gz
  sha256: 4793ef7f78268b124b73fa933440f01d258bbae01de9fa53e9080c9ab0425a12

build:
  number: 0
  skip: true  # [py<311]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - python                                 # [build_platform != target_platform]
    - maturin >=1.9,<2.0                     # [build_platform != target_platform]
  host:
    - maturin >=1.9,<2.0
    - pip
    - python
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - rpds
  commands:
    - pip check
    - pytest -v tests
  requires:
    - pip
    - pytest

about:
  home: https://github.com/crate-py/rpds
  summary: Python bindings to Rust's persistent data structures (rpds)
  description: Python bindings to Rust's persistent data structures (rpds)
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  dev_url: https://github.com/crate-py/rpds
  doc_url: https://github.com/crate-py/rpds?tab=readme-ov-file#usage

extra:
  recipe-maintainers:
    - bollwyvl
